# fly.io example for the Node relay: fly launch (pick a region) then fly deploy.
app = "opensro-team-relay"
primary_region = "cdg"

[build]

[http_service]
internal_port = 4701
force_https = true
auto_stop_machines = false   # WebSockets must stay connected
auto_start_machines = true
min_machines_running = 1     # the relay is the fleet's home: keep it up

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
